<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="Research: Swapping the Model Does Not Reset the Price. Apart Research, AI Collusion Research Sprint, October 2026, pre-registered. If AI pricing agents start colluding and you replace the model behind one of them, prices don't reset. With the old agent's notes, the new model picks up exactly where the old one left off in 18 of 18 markets; without them it anchors high and takes about 16 rounds to settle. The notes contain no collusive language, so a monitor that scans agent memory would miss this channel."><style>@font-face{font-family:'Grotesk';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Grotesk';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}.h{font:700 34px 'Grotesk',sans-serif;fill:#eaf0ff} .s{font:500 14px 'Mono',monospace;letter-spacing:1.5px;fill:#a78bfa}
.p{font:500 18.5px 'Grotesk',sans-serif;fill:#b6c5e3} .n{font:700 30px 'Grotesk',sans-serif} .k{font:500 15px 'Grotesk',sans-serif;fill:#7f93bb}
.ax{font:500 14px 'Grotesk',sans-serif;fill:#7f93bb}
.draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.4s .4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}}</style><defs><linearGradient id="g-neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1a"/><stop offset="1" stop-color="#160f36"/></linearGradient>
<linearGradient id="g-neon-h" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1280" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<linearGradient id="g-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/><stop offset=".5" stop-color="#a78bfa" stop-opacity=".25"/><stop offset="1" stop-color="#f472b6" stop-opacity=".55"/></linearGradient>
<filter id="glow" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1500" height="800"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="1" y="1" width="1278" height="518" rx="22" fill="url(#g-bg)"/><rect x="1" y="1" width="1278" height="518" rx="22" fill="none" stroke="url(#g-edge)" stroke-width="1.5"/><text x="56" y="74" class="s">RESEARCH</text><text x="56" y="116" class="h">Swapping the Model Does</text><text x="56" y="156" class="h">Not Reset the Price</text><text x="56" y="190" class="s" style="fill:#7f93bb">APART RESEARCH, AI COLLUSION RESEARCH SPRINT, OCTOBER 2026, PRE-REGISTERED</text><text x="56" y="232" class="p">If AI pricing agents start colluding and you replace the model behind one of</text><text x="56" y="260" class="p">them, prices don't reset. With the old agent's notes, the new model picks up</text><text x="56" y="288" class="p">exactly where the old one left off in 18 of 18 markets; without them it</text><text x="56" y="316" class="p">anchors high and takes about 16 rounds to settle. The notes contain no</text><text x="56" y="344" class="p">collusive language, so a monitor that scans agent memory would miss this</text><text x="56" y="372" class="p">channel.</text><text x="56" y="450" class="n" fill="#a78bfa">18/18</text><text x="56" y="478" class="k">markets resume the old price</text><text x="292" y="450" class="n" fill="#f472b6">1 vs 16.5</text><text x="292" y="478" class="k">median rounds to settle</text><text x="528" y="450" class="n" fill="#22d3ee">5</text><text x="528" y="478" class="k">conditions, 250 rounds each</text><rect x="800" y="70" width="450" height="360" rx="18" fill="#0f1730" opacity=".7"/><line x1="830" y1="380" x2="1220" y2="380" stroke="#24305a" stroke-width="2"/><line x1="830" y1="380" x2="830" y2="110" stroke="#24305a" stroke-width="2"/><text x="830" y="98" class="ax">price</text><text x="1220" y="408" class="ax" text-anchor="end">rounds</text><line x1="930" y1="380" x2="930" y2="120" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 5"/><text x="938" y="132" class="ax" style="fill:#fbbf24">model swapped</text><path d="M830 250 H930" stroke="#eaf0ff" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M930 250 L934 140 C 990 170 1050 240 1120 248 S 1210 250 1220 250" stroke="#f472b6" stroke-width="3" fill="none" stroke-dasharray="3 6" stroke-linecap="round"/><path d="M930 250 H1220" stroke="#a78bfa" stroke-width="5" fill="none" stroke-linecap="round" class="draw" filter="url(#glow)"/><text x="1220" y="282" class="ax" text-anchor="end" style="fill:#a78bfa">keeps notes</text><text x="982" y="162" class="ax" style="fill:#f472b6">clean slate</text></svg>