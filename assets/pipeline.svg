<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Retry Budget Allocator pipeline: six deterministic stages, one model call">
<rect width="1000" height="300" rx="20" fill="#0b1226"/>
<text x="40" y="52" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff">How a failed payment flows through Retry Budget Allocator</text>
<text x="40" y="78" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="13.5" fill="#9fb3d1">Six stages are plain, testable code. Only the last one calls a model, and it never decides anything.</text>
<path d="M96.0,144 L230.7,144 L365.3,144 L500.0,144 L634.7,144 L769.3,144 L904.0,144" stroke="#2a3a66" stroke-width="2" fill="none" stroke-dasharray="5 6"><animate attributeName="stroke-dashoffset" from="22" to="0" dur="1.2s" repeatCount="indefinite"/></path><rect x="40.0" y="110" width="112" height="68" rx="13" fill="#101a38" stroke="#22d3ee" stroke-opacity=".7"/>
<text x="50.0" y="126" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" fill="#22d3ee">1</text><text x="96.0" y="146" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Ingest</text>
<text x="96.0" y="170" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="10.5" fill="#8aa0c8">keeps raw error</text><rect x="174.66666666666666" y="110" width="112" height="68" rx="13" fill="#101a38" stroke="#22d3ee" stroke-opacity=".7"/>
<text x="184.66666666666666" y="126" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" fill="#22d3ee">2</text><text x="230.66666666666666" y="146" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Classify</text>
<text x="230.66666666666666" y="170" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="10.5" fill="#8aa0c8">lookup table</text><rect x="309.3333333333333" y="110" width="112" height="68" rx="13" fill="#101a38" stroke="#60a5fa" stroke-opacity=".7"/>
<text x="319.3333333333333" y="126" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" fill="#60a5fa">3</text><text x="365.3333333333333" y="146" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Priors</text>
<text x="365.3333333333333" y="170" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="10.5" fill="#8aa0c8">recovery odds</text><rect x="444.0" y="110" width="112" height="68" rx="13" fill="#101a38" stroke="#60a5fa" stroke-opacity=".7"/>
<text x="454.0" y="126" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" fill="#60a5fa">4</text><text x="500.0" y="132" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Funding</text><text x="500.0" y="149" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">window</text>
<text x="500.0" y="170" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="10.5" fill="#8aa0c8">probabilistic</text><rect x="578.6666666666666" y="110" width="112" height="68" rx="13" fill="#101a38" stroke="#a78bfa" stroke-opacity=".7"/>
<text x="588.6666666666666" y="126" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" fill="#a78bfa">5</text><text x="634.6666666666666" y="146" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Allocate</text>
<text x="634.6666666666666" y="170" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="10.5" fill="#8aa0c8">score every slot</text><rect x="713.3333333333333" y="110" width="112" height="68" rx="13" fill="#101a38" stroke="#a78bfa" stroke-opacity=".7"/>
<text x="723.3333333333333" y="126" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" fill="#a78bfa">6</text><text x="769.3333333333333" y="146" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Decide</text>
<text x="769.3333333333333" y="170" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="10.5" fill="#8aa0c8">ask / retry / stop</text><rect x="848.0" y="110" width="112" height="68" rx="13" fill="#101a38" stroke="#f472b6" stroke-opacity=".7"/><rect x="844.0" y="106" width="120" height="76" rx="16" fill="none" stroke="#f472b6" stroke-width="2"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></rect>
<text x="858.0" y="126" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" fill="#f472b6">7</text><text x="904.0" y="146" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Explain</text>
<text x="904.0" y="170" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="10.5" fill="#8aa0c8">the only model call</text><circle r="5" fill="#22d3ee"><animateMotion dur="7s" begin="0s" repeatCount="indefinite" path="M96.0,144 L230.7,144 L365.3,144 L500.0,144 L634.7,144 L769.3,144 L904.0,144"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="7s" begin="0s" repeatCount="indefinite"/></circle><circle r="5" fill="#a78bfa"><animateMotion dur="7s" begin="2.3s" repeatCount="indefinite" path="M96.0,144 L230.7,144 L365.3,144 L500.0,144 L634.7,144 L769.3,144 L904.0,144"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="7s" begin="2.3s" repeatCount="indefinite"/></circle><circle r="5" fill="#34d399"><animateMotion dur="7s" begin="4.6s" repeatCount="indefinite" path="M96.0,144 L230.7,144 L365.3,144 L500.0,144 L634.7,144 L769.3,144 L904.0,144"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="7s" begin="4.6s" repeatCount="indefinite"/></circle>
<rect x="40" y="214" width="785" height="34" rx="10" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".5"/>
<text x="433" y="236" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="13" fill="#22d3ee" font-weight="700">Deterministic: same input, same decision. Rules checked on every attempt.</text>
<rect x="848.0" y="214" width="112" height="34" rx="10" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".6"/>
<text x="904.0" y="236" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="13" fill="#f472b6" font-weight="700">Wording only</text>
<text x="500.0" y="278" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="12" fill="#6b7da3">If the model provider is down, the explanation falls back to a template and the decision is identical.</text>
</svg>