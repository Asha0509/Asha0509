 <text x="640.0" y="326" class="sub" text-anchor="middle">AI/ML and software engineer, researcher, B.Tech CS (AI &amp; ML) at BVRIT Hyderabad, class of 2027</text>
 <g class="f1"><g transform="translate(0 404)"><rect x="134.9" y="0" width="172.7" height="40" rx="20.0" fill="#FFFFFF"/><text x="221.3" y="26.5" class="chip" text-anchor="middle" fill="#5B8FD9">3 live AI systems</text></g></g><g class="f2"><g transform="translate(0 404)"><rect x="321.6" y="0" width="203.1" height="40" rx="20.0" fill="#FFFFFF"/><text x="423.2" y="26.5" class="chip" text-anchor="middle" fill="#7A62C9">Research with Apart</text></g></g><g class="f3"><g transform="translate(0 404)"><rect x="538.7" y="0" width="228.7" height="40" rx="20.0" fill="#FFFFFF"/><text x="653.1" y="26.5" class="chip" text-anchor="middle" fill="#D9764E">Code by Groww finalist</text></g></g><g class="f4"><g transform="translate(0 404)"><rect x="781.5" y="0" width="221.6" height="40" rx="20.0" fill="#FFFFFF"/><text x="892.3" y="26.5" class="chip" text-anchor="middle" fill="#3E9A78">Flipkart GRiD top 0.5%</text></g></g><g class="f5"><g transform="translate(0 404)"><rect x="1017.1" y="0" width="128.0" height="40" rx="20.0" fill="#FFFFFF"/><text x="1081.1" y="26.5" class="chip" text-anchor="middle" fill="#C99A1E">CGPA 8.80</text></g></g>
