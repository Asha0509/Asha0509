<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="Asha Jyothi Boddu. I build AI that people can trust and engineers can check. AI/ML and software engineer, researcher, B.Tech CS (AI &amp; ML) at BVRIT Hyderabad, class of 2027."><style>@font-face{font-family:'Bricolage';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Figtree';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Figtree';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Figtree';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}
.name{font:800 104px 'Bricolage',sans-serif;fill:#1F2A44;letter-spacing:-2px}
.line{font:500 33px 'Figtree',sans-serif;fill:#1F2A44}
.sub{font:400 21px 'Figtree',sans-serif;fill:#5A6478}
.chip{font:600 18px 'Figtree',sans-serif}
.b1{animation:drift1 14s ease-in-out infinite alternate}
.b2{animation:drift2 17s ease-in-out infinite alternate}
.b3{animation:drift3 19s ease-in-out infinite alternate}
.f1{animation:bob 6s ease-in-out infinite} .f2{animation:bob 7s ease-in-out -2s infinite}
.f3{animation:bob 6.5s ease-in-out -4s infinite} .f4{animation:bob 7.5s ease-in-out -1s infinite} .f5{animation:bob 6.8s ease-in-out -3s infinite}
@keyframes drift1{to{transform:translate(60px,30px)}}
@keyframes drift2{to{transform:translate(-70px,20px)}}
@keyframes drift3{to{transform:translate(40px,-35px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.b1,.b2,.b3,.f1,.f2,.f3,.f4,.f5{animation:none}}
</style>
<defs>
 <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
 <clipPath id="hc"><rect width="1280" height="560" rx="28"/></clipPath>
</defs>
<g clip-path="url(#hc)">
 <rect width="1280" height="560" fill="#F7F9FD"/>
